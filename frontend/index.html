<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Léa Foto e Arte</title>
    <style>
      @font-face {
        font-family: 'Viminalis';
        src: url('/fonts/Viminalis.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      .loading-container {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .loading-imagem {
        width: 4rem;
      }

      .loading-texto {
        font-family: 'Viminalis', sans-serif;
        margin-top: 1rem;
        font-size: 1.5rem;
        font-weight: normal;
      }

      @keyframes tailwind-bounce {
        0%,
        100% {
          transform: translateY(-25%);
          animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
        }
        50% {
          transform: none;
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
      }
      .animate-bounce-puro {
        animation: tailwind-bounce 1s infinite;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="loading-container">
        <img
          class="loading-imagem animate-bounce-puro"
          src="/images/borboleta.png"
          alt="Carregando..."
        />
        <h1 class="loading-texto">Carregando...</h1>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
